name: Repository CI

on:
  pull_request:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        package: [simulator, explorer-api, explorer-web, control-api]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: |
            simulator/package-lock.json
            explorer-api/package-lock.json
            explorer-web/package-lock.json
            control-api/package-lock.json
      - name: Install simulator dependency for API validation
        if: matrix.package == 'explorer-api'
        run: npm ci --prefix simulator --omit=dev --ignore-scripts
      - name: Install locked dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci --ignore-scripts
      - name: Run tests
        working-directory: ${{ matrix.package }}
        run: npm test
      - name: Typecheck and build frontend
        if: matrix.package == 'explorer-web'
        working-directory: explorer-web
        run: npm run build
      - name: Verify runner Chrome without installing a browser
        if: matrix.package == 'explorer-web' && matrix.os == 'ubuntu-latest'
        timeout-minutes: 1
        run: |
          command -v google-chrome >/dev/null || {
            echo '::error::The hosted runner must provide Google Chrome; CI will not install a browser.'
            exit 1
          }
          google-chrome --version
      - name: Install control verifier for signed browser fixtures
        if: matrix.package == 'explorer-web' && matrix.os == 'ubuntu-latest'
        run: npm ci --prefix control-api --ignore-scripts
      - name: Check browser controls with isolated Kubernetes fixtures
        if: matrix.package == 'explorer-web' && matrix.os == 'ubuntu-latest'
        timeout-minutes: 1
        working-directory: explorer-web
        env:
          CONTROL_CHECK_BROWSER: chrome
        run: npm run check:controls
      - name: Check managed controls with signed ALB fixtures
        if: matrix.package == 'explorer-web' && matrix.os == 'ubuntu-latest'
        timeout-minutes: 1
        working-directory: explorer-web
        env:
          CONTROL_CHECK_BROWSER: chrome
          CONTROL_CHECK_AUTH_MODE: alb
        run: npm run check:controls

  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: load-test/requirements.txt
      - run: pip install -r load-test/requirements.txt
      - run: python -m unittest discover -s load-test -p 'test_*.py'

  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.36.1'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
      - run: pip install -r scripts/requirements-validation.txt
      - run: python scripts/test-dev-promotion.py
      - run: python scripts/install-kubeconform.py
      - run: python -m unittest discover -s scripts/test -p 'test_delivery*.py'
      - run: python scripts/validate-manifests.py --schema

  terraform:
    name: Offline Terraform and lifecycle guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHECKPOINT_DISABLE: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.5'
          terraform_wrapper: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
      - run: terraform -chdir=infra/aws/lab fmt -check -recursive
      - name: Install the locked provider without a backend
        run: terraform -chdir=infra/aws/lab init -backend=false -lockfile=readonly -input=false
      - run: terraform -chdir=infra/aws/lab validate -no-color
      - name: Run mocked plans only (no AWS credentials)
        run: terraform -chdir=infra/aws/lab test -no-color
      - run: node --test infra/aws/tools/foundation-guards.test.mjs

  images:
    needs: [node-tests, load-test, manifests, operations, terraform]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      OCI_HANDOFF: ${{ github.event_name == 'pull_request' && !inputs.publish && matrix.oci }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: simulator
            context: simulator
            file: simulator/Dockerfile
            oci: true
          - name: explorer-api
            context: .
            file: explorer-api/Dockerfile
            oci: true
          - name: explorer-web
            context: explorer-web
            file: explorer-web/Dockerfile
            oci: true
          - name: load-test
            context: load-test
            file: load-test/Dockerfile
          - name: control-api
            context: control-api
            file: control-api/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - name: Enable Docker OCI image loading
        if: env.OCI_HANDOFF == 'true'
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@v3
      - name: Normalize registry owner
        id: registry
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: inputs.publish == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image for testing
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: ${{ env.OCI_HANDOFF != 'true' }}
          outputs: ${{ env.OCI_HANDOFF == 'true' && format('type=oci,dest={0}/{1}.oci.tar', runner.temp, matrix.name) || '' }}
          platforms: ${{ env.OCI_HANDOFF == 'true' && 'linux/amd64' || '' }}
          provenance: ${{ env.OCI_HANDOFF == 'true' && 'false' || '' }}
          sbom: ${{ env.OCI_HANDOFF == 'true' && 'false' || '' }}
          push: false
          tags: ghcr.io/${{ steps.registry.outputs.owner }}/metronome-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Load OCI archive for packaged tests
        if: env.OCI_HANDOFF == 'true'
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_REF: ghcr.io/${{ steps.registry.outputs.owner }}/metronome-${{ matrix.name }}:${{ github.sha }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker load --input "$RUNNER_TEMP/$IMAGE_NAME.oci.tar"
          loaded_digest="$(docker image inspect "$IMAGE_REF" --format '{{.Descriptor.Digest}}')"
          [[ "$loaded_digest" == "$BUILD_DIGEST" ]]
      - name: Test packaged control API
        if: matrix.name == 'control-api'
        env:
          IMAGE_REF: ghcr.io/${{ steps.registry.outputs.owner }}/metronome-${{ matrix.name }}:${{ github.sha }}
        run: |
          docker run --rm --read-only --tmpfs /tmp \
            --mount "type=bind,source=$GITHUB_WORKSPACE/control-api/test,target=/app/test,readonly" \
            "$IMAGE_REF" node --test
      - name: Test packaged simulator, runner and publisher
        if: matrix.name == 'simulator'
        env:
          IMAGE_REF: ghcr.io/${{ steps.registry.outputs.owner }}/metronome-${{ matrix.name }}:${{ github.sha }}
        run: |
          docker run --rm --read-only --tmpfs /tmp \
            --mount "type=bind,source=$GITHUB_WORKSPACE/simulator/test,target=/app/test,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/simulator/test-support,target=/app/test-support,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/evidence,target=/evidence,readonly" \
            "$IMAGE_REF" node --test
      - name: Test packaged explorer API
        if: matrix.name == 'explorer-api'
        env:
          IMAGE_REF: ghcr.io/${{ steps.registry.outputs.owner }}/metronome-${{ matrix.name }}:${{ github.sha }}
        run: |
          docker run --rm --read-only --tmpfs /tmp \
            --mount "type=bind,source=$GITHUB_WORKSPACE/explorer-api/test,target=/app/explorer-api/test,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/evidence,target=/app/evidence,readonly" \
            --workdir /app/explorer-api \
            "$IMAGE_REF" node --test
      - name: Check packaged web server and control proxy
        if: matrix.name == 'explorer-web'
        env:
          IMAGE_REF: ghcr.io/${{ steps.registry.outputs.owner }}/metronome-${{ matrix.name }}:${{ github.sha }}
        run: |
          npm ci --prefix control-api --ignore-scripts
          node scripts/check-web-image.mjs "$IMAGE_REF"
      - name: Test packaged load generator without sending traffic
        if: matrix.name == 'load-test'
        env:
          IMAGE_REF: ghcr.io/${{ steps.registry.outputs.owner }}/metronome-${{ matrix.name }}:${{ github.sha }}
        run: |
          docker run --rm --read-only --tmpfs /tmp --network none \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/load-test/test_locustfile.py,target=/home/locust/test_locustfile.py,readonly" \
            --workdir /home/locust --entrypoint python \
            "$IMAGE_REF" -m unittest discover -s /home/locust -p 'test_*.py'
      - name: Record tested OCI archive
        if: env.OCI_HANDOFF == 'true'
        env:
          IMAGE_NAME: ${{ matrix.name }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        working-directory: ${{ runner.temp }}
        run: |
          sha256sum "$IMAGE_NAME.oci.tar" > "$IMAGE_NAME.oci.tar.sha256"
          printf '%s\n' "$BUILD_DIGEST" > "$IMAGE_NAME.manifest-digest"
      - name: Upload tested OCI archive
        if: env.OCI_HANDOFF == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oci-handoff-${{ matrix.name }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/${{ matrix.name }}.oci.tar
            ${{ runner.temp }}/${{ matrix.name }}.oci.tar.sha256
            ${{ runner.temp }}/${{ matrix.name }}.manifest-digest
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Publish tested image
        if: inputs.publish == true
        env:
          IMAGE_REF: ghcr.io/${{ steps.registry.outputs.owner }}/metronome-${{ matrix.name }}:${{ github.sha }}
        run: docker push "$IMAGE_REF"
      - name: Record published image
        if: inputs.publish == true
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_REF: ghcr.io/${{ steps.registry.outputs.owner }}/metronome-${{ matrix.name }}:${{ github.sha }}
        run: |
          published_ref="$(
            docker image inspect "$IMAGE_REF" --format '{{json .RepoDigests}}' |
              jq -er --arg prefix "${IMAGE_REF%:*}@" '
                map(select(startswith($prefix))) |
                if length == 1 then .[0]
                else error("Expected exactly one digest for this repository")
                end
              '
          )"

          [[ "$published_ref" =~ @sha256:[0-9a-f]{64}$ ]]

          mkdir -p release-images
          jq -n \
            --arg name "$IMAGE_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg image "$published_ref" \
            '{name: $name, commit: $commit, image: $image}' \
            > "release-images/$IMAGE_NAME.json"
      - name: Save published image record
        if: inputs.publish == true
        uses: actions/upload-artifact@v4
        with:
          name: release-image-${{ matrix.name }}-${{ github.run_attempt }}
          path: release-images/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 30

  operations:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
      - run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Validate maintained files and capture policies
        run: |
          node scripts/check-file-size.js
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" \
            --workdir /repo rhysd/actionlint:1.7.12
          for script in scripts/*.sh scripts/lib/*.sh; do bash -n "$script"; done
          shellcheck -x -P SCRIPTDIR scripts/*.sh
          python3 -m unittest discover -s scripts/test -p 'test_*.py'

  oci-handoff:
    name: Verify OCI handoff (dry run)
    if: github.event_name == 'pull_request' && !inputs.publish
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Download tested OCI archives
        uses: actions/download-artifact@v4
        with:
          pattern: oci-handoff-*-${{ github.run_attempt }}
          path: oci-handoff
      - name: Verify archive checksums and manifest digests
        shell: bash
        run: |
          {
            echo '### OCI handoff dry run'
            echo '| Image | Archive bytes | Verified manifest digest |'
            echo '| --- | ---: | --- |'
            for image in simulator explorer-api explorer-web; do
              (
                cd "oci-handoff/oci-handoff-$image-$GITHUB_RUN_ATTEMPT"
                archive="$image.oci.tar"
                expected_checksum="$(cut -d ' ' -f 1 "$archive.sha256")"
                actual_checksum="$(sha256sum "$archive" | cut -d ' ' -f 1)"
                [[ "$actual_checksum" == "$expected_checksum" ]]

                expected_digest="$(cat "$image.manifest-digest")"
                [[ "$expected_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
                index_digest="$(tar -xOf "$archive" index.json | jq -er '
                  .manifests | select(length == 1) | .[0]
                  | select(.mediaType == "application/vnd.oci.image.manifest.v1+json")
                  | .digest')"
                [[ "$index_digest" == "$expected_digest" ]]
                manifest_hash="$(tar -xOf "$archive" "blobs/sha256/${expected_digest#sha256:}" | sha256sum | cut -d ' ' -f 1)"
                [[ "sha256:$manifest_hash" == "$expected_digest" ]]
                printf '| %s | %s | %s |\n' "$image" "$(stat -c %s "$archive")" "$expected_digest"
              )
            done
          } >> "$GITHUB_STEP_SUMMARY"

  release-ready:
    name: Assemble verified release
    needs: images
    if: inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Download image records from this attempt
        uses: actions/download-artifact@v4
        with:
          pattern: release-image-*-${{ github.run_attempt }}
          path: release-images
          merge-multiple: true

      - name: Validate and assemble release record
        shell: bash
        run: |
          jq -es \
            --arg commit "$GITHUB_SHA" \
            --arg owner "${GITHUB_REPOSITORY_OWNER,,}" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" '
              ["control-api", "explorer-api", "explorer-web",
               "load-test", "simulator"] as $expected |

              if (map(.name) | sort) == $expected
                and all(.[];
                  .commit == $commit and
                  (. as $record | .image |
                    test("^ghcr.io/" + $owner + "/metronome-" +
                         $record.name + "@sha256:[0-9a-f]{64}$"))
                )
              then {
                schemaVersion: 1,
                commit: $commit,
                workflowRun: $run,
                workflowAttempt: $attempt,
                images: (map({key: .name, value: .image}) | from_entries)
              }
              else error("Missing, duplicate, or mismatched image records")
              end
            ' release-images/*.json > release.json

      - name: Save complete release record
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-${{ github.run_attempt }}
          path: release.json
          if-no-files-found: error
          retention-days: 30

