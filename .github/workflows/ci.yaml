name: Repository CI

on:
  pull_request:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [simulator, explorer-api, explorer-web]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: |
            simulator/package-lock.json
            explorer-api/package-lock.json
            explorer-web/package-lock.json
      - name: Install simulator dependency for API validation
        if: matrix.package == 'explorer-api'
        run: npm ci --prefix simulator --omit=dev --ignore-scripts
      - name: Install locked dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci --ignore-scripts
      - name: Run tests
        working-directory: ${{ matrix.package }}
        run: npm test
      - name: Typecheck and build frontend
        if: matrix.package == 'explorer-web'
        working-directory: explorer-web
        run: npm run build

  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: load-test/requirements.txt
      - run: pip install -r load-test/requirements.txt
      - run: python -m unittest discover -s load-test -p 'test_*.py'

  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.36.1'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r scripts/requirements-validation.txt
      - run: python scripts/validate-manifests.py

  images:
    needs: [node-tests, load-test, manifests, operations]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: simulator
            context: simulator
            file: simulator/Dockerfile
          - name: explorer-api
            context: .
            file: explorer-api/Dockerfile
          - name: explorer-web
            context: explorer-web
            file: explorer-web/Dockerfile
          - name: load-test
            context: load-test
            file: load-test/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Normalize registry owner
        id: registry
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: inputs.publish == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build verified image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ inputs.publish == true }}
          tags: ghcr.io/${{ steps.registry.outputs.owner }}/metronome-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  operations:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
      - run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Validate maintained files and capture policies
        run: |
          node scripts/check-file-size.js
          for script in scripts/*.sh scripts/lib/*.sh; do bash -n "$script"; done
          shellcheck -x -P SCRIPTDIR scripts/*.sh
          python3 -m unittest discover -s scripts/test -p 'test_*.py'
