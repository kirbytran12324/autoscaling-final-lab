name: Publish Verified Images

on:
  push:
    branches: [main]
    paths:
      - 'simulator/**'
      - 'explorer-api/**'
      - 'explorer-web/**'
      - 'load-test/**'
      - 'k8s/**'
      - 'scripts/validate-manifests.py'
      - 'scripts/requirements-validation.txt'
      - '.dockerignore'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify-and-publish:
    uses: ./.github/workflows/ci.yaml
    with:
      publish: true
