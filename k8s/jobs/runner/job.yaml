apiVersion: batch/v1
kind: Job
metadata:
  name: tournament-runner
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  podReplacementPolicy: Failed
  template:
    metadata:
      labels:
        app: tournament-runner
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      containers:
        - name: runner
          image: metronome-simulator:phase5
          imagePullPolicy: IfNotPresent
          command:
            - npm
          args:
            - run
            - runner
          env:
            - name: TOURNAMENT_RUN_ID
              value: "sample-32-001"
            - name: TOURNAMENT_MODE
              value: "sample"
            - name: TOURNAMENT_SEED
              value: "sample-32-seed-001"
            - name: TOURNAMENT_STATE_ROOT
              value: "/data/tournaments"
            - name: SIMULATOR_BASE_URL
              value: "http://metronome-simulator"
            - name: RUNNER_CONCURRENCY
              value: "2"
            - name: RULES_VERSION
              value: "metronome-singles-v1"
            - name: SIMULATOR_VERSION
              value: "pokemon-showdown@0.11.11"
            - name: SIMULATOR_IMAGE
              value: "metronome-simulator:phase5"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tournament-state
              mountPath: /data/tournaments
      volumes:
        - name: tournament-state
          persistentVolumeClaim:
            claimName: tournament-state
