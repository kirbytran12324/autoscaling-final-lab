# Optional HTTP learning exercise. Configure hostname and TLS before public use.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: explorer
spec:
  gatewayClassName: approuting-istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: explorer
spec:
  parentRefs:
    - name: explorer
  hostnames: [explorer.example.com]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: metronome-explorer-web
          port: 80
