apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: metronome-dev

resources:
  - ../../common
  - namespace.yaml
  - ../../checks

images:
  - name: metronome-simulator
    newName: ghcr.io/kirbytran12324/metronome-simulator
    digest: sha256:4961280918ae27070786b90b5e9963c3a74eabd285b74cea6b036207a1091d6c

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: metronome-simulator
    path: deployment-patch.yaml

  - target:
      version: v1
      kind: ConfigMap
      name: metronome-config
    path: configmap-patch.yaml