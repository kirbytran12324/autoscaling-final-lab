apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: metronome-dev

resources:
  - ../../common
  - namespace.yaml

images:
  - name: metronome-simulator
    newTag: 80fd0c0

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: metronome-simulator
    path: deployment-patch.yaml

  - target:
      version: v1
      kind: ConfigMap
      name: metronome-config
    path: configmap-patch.yaml