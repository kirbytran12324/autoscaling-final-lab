apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: metronome-dev

resources:
  - ../../common
  - namespace.yaml
  - ../../checks

images:
  - name: metronome-simulator
    newName: ghcr.io/kirbytran12324/metronome-simulator
    digest: sha256:75618a5f113543a208c9e0ec3bf1e9a1532e984637fe450f4ba5dfad0d7a52fd

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: metronome-simulator
    path: deployment-patch.yaml

  - target:
      version: v1
      kind: ConfigMap
      name: metronome-config
    path: configmap-patch.yaml