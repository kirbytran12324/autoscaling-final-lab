apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metronome-prod
  namespace: argocd
spec:
  project: metronome-prod
  source:
    repoURL: https://github.com/kirbytran12324/autoscaling-final-lab.git
    targetRevision: main
    path: k8s/gitops/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: metronome-prod
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
