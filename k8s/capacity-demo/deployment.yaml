apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-capacity-demo
spec:
  replicas: 4
  selector:
    matchLabels:
      app: cpu-capacity-demo
  template:
    metadata:
      labels:
        app: cpu-capacity-demo
    spec:
      terminationGracePeriodSeconds: 0
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: sleeper
          image: busybox:1.36
          command:
            - sleep
            - "86400"
          resources:
            requests:
              cpu: 6100m
              memory: 16Mi
            limits:
              cpu: 6100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
