# Mount this file separately into /etc/nginx/control.d/control.conf when the
# control Service exists. It is deliberately excluded from the default image.
location ~ ^/(api/control(?:/|$)|auth/logout$) {
  proxy_pass http://metronome-control-api:3002;
  proxy_http_version 1.1;
  # Preserve the browser's port for the control API's same-origin check.
  proxy_set_header Host $http_host;
  # Trust boundary: AWS security groups restrict web ingress to the ALB and
  # control ingress to web Pods. Host and scheme originate at that ALB.
  proxy_set_header X-Forwarded-Proto $control_forwarded_proto;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Original-URI $request_uri;
  proxy_set_header X-Amzn-Oidc-Data $http_x_amzn_oidc_data;
  # Only the signed data header is used; do not propagate legacy plaintext.
  proxy_set_header X-Amzn-Oidc-Identity "";
  proxy_set_header X-Amzn-Oidc-Accesstoken "";
  proxy_buffering off;
  proxy_read_timeout 60s;
  client_max_body_size 4k;
}
